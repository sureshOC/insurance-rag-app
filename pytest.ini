[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    integration: Tests that require live Ollama and Qdrant containers.
    guardrails: Tests validating refusal and out-of-domain checks.
    latency: Tests validating response latency SLA threshold.